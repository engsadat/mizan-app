<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <title>ميزان — تسجيل الدخول</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <style>body { font-family: 'Cairo', sans-serif; background: #f0f4f8; }</style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100">
  <div class="card shadow" style="width:360px">
    <div class="card-body p-4">
      <h4 class="text-center mb-1" style="color:#0a1f3d">ميزان</h4>
      <p class="text-center text-muted small mb-4">نظام الموارد البشرية — المنطقة الجنوبية</p>
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for cat, msg in messages %}
          <div class="alert alert-{{ cat }} py-2">{{ msg }}</div>
        {% endfor %}
      {% endwith %}
      <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
          <label class="form-label">اسم المستخدم</label>
          <input type="text" name="username" class="form-control" required autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label">كلمة المرور</label>
          <input type="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn w-100" style="background:#0a1f3d;color:#fff">دخول</button>
      </form>
    </div>
  </div>
</body>
</html>
