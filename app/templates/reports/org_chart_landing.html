<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الهيكل التنظيمي — ميزان</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Cairo', sans-serif;
      background: linear-gradient(135deg, #f8fafc 0%, #e8f0f7 100%);
      min-height: 100vh;
    }
    .navbar {
      background: linear-gradient(90deg, #0a1f3d 0%, #0d2b5a 100%);
      box-shadow: 0 2px 8px rgba(10, 31, 61, 0.15);
    }
    .navbar-brand {
      font-weight: 700;
      font-size: 1.5rem;
    }
    .page-title {
      color: #0a1f3d;
      font-weight: 700;
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }
    .page-subtitle {
      color: #64748b;
      font-size: 0.95rem;
    }
    .regions-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1.5rem;
      margin-top: 2rem;
    }
    .region-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      border-radius: 12px;
      border: none;
      box-shadow: 0 4px 12px rgba(10, 31, 61, 0.1);
      text-decoration: none;
      color: white;
      font-weight: 600;
      transition: all 0.25s ease;
      text-align: center;
      min-height: 200px;
      cursor: pointer;
    }
    .region-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 12px 24px rgba(10, 31, 61, 0.2);
      text-decoration: none;
      color: white;
    }
    .region-card-icon {
      font-size: 2.5rem;
      margin-bottom: 1rem;
    }
    .region-card-name {
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .region-card-hint {
      font-size: 0.85rem;
      opacity: 0.85;
      margin-top: 0.5rem;
    }
    /* Region-specific colors */
    .card-asir {
      background: linear-gradient(135deg, #0071b9 0%, #0a5ba8 100%);
    }
    .card-jizan {
      background: linear-gradient(135deg, #00a88b 0%, #008b7c 100%);
    }
    .card-baha {
      background: linear-gradient(135deg, #29abe2 0%, #1a7fa8 100%);
    }
    .card-najran {
      background: linear-gradient(135deg, #78909c 0%, #546e7a 100%);
    }
    .back-button {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: #0a1f3d;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
    }
    .back-button:hover {
      color: #0d2b5a;
    }
  </style>
</head>
<body>
<nav class="navbar">
  <div class="container-fluid px-3">
    <a href="/" class="navbar-brand text-white">ميزان</a>
    <span class="text-white fw-bold">الهيكل التنظيمي</span>
    <a href="/auth/logout" class="btn btn-sm btn-outline-light ms-auto">خروج</a>
  </div>
</nav>

<div class="container py-4" style="max-width: 900px;">
  <a href="/reports/" class="back-button">← العودة إلى التقارير</a>

  <h1 class="page-title">الهيكل التنظيمي</h1>
  <p class="page-subtitle">اختر المنطقة لعرض الهيكل التنظيمي التفصيلي</p>

  <div class="regions-grid">
    {% for region in regions %}
      <a href="/reports/org-chart/{{ region.code }}" class="region-card card-{{ region.code }}">
        <div class="region-card-icon">📊</div>
        <div class="region-card-name">{{ region.name }}</div>
        <div class="region-card-hint">عرض الهيكل</div>
      </a>
    {% endfor %}
  </div>
</div>
</body>
</html>
