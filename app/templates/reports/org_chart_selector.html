<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الهيكل التنظيمي — اختيار المنطقة</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Cairo', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
    }
    .container-select {
      max-width: 800px;
      margin: auto;
    }
    .header {
      background: white;
      padding: 2rem;
      border-radius: 12px 12px 0 0;
      text-align: center;
      box-shadow: 0 4px 12px rgba(0,0,0,.1);
    }
    .header h1 {
      color: #0a1f3d;
      font-weight: 900;
      margin: 0;
      font-size: 2rem;
    }
    .header p {
      color: #666;
      margin-top: 0.5rem;
      font-size: 0.95rem;
    }
    .region-card {
      background: white;
      border: none;
      border-radius: 12px;
      padding: 2rem;
      text-decoration: none;
      color: inherit;
      transition: all 0.3s ease;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
      text-align: center;
      display: block;
      height: 100%;
    }
    .region-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 8px 24px rgba(0,0,0,.15);
      color: inherit;
    }
    .region-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
    }
    .region-name {
      font-size: 1.5rem;
      font-weight: 900;
      color: #0a1f3d;
      margin-bottom: 0.5rem;
    }
    .region-desc {
      font-size: 0.9rem;
      color: #666;
    }
    .footer {
      background: white;
      padding: 1.5rem 2rem;
      border-radius: 0 0 12px 12px;
      text-align: center;
      box-shadow: 0 4px 12px rgba(0,0,0,.1);
      color: #666;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

<div class="container-select">
  <div class="header">
    <h1>الهيكل التنظيمي</h1>
    <p>اختر المنطقة لعرض الهيكل التنظيمي والمشاريع والموظفين</p>
  </div>

  <div class="row g-4 p-4 bg-white">
    {% for region in regions %}
    <div class="col-6 col-sm-6 col-md-6">
      <a href="/reports/org-chart/{{ region.code }}" class="region-card">
        <div class="region-icon">🏢</div>
        <div class="region-name">{{ region.name }}</div>
        <div class="region-desc">منطقة {{ region.name }}</div>
      </a>
    </div>
    {% endfor %}
  </div>

  <div class="footer">
    <a href="/reports" style="text-decoration: none; color: #0071b9;">← العودة إلى التقارير</a>
  </div>
</div>

</body>
</html>
