<div class="d-flex justify-content-between align-items-start mb-3">
  <h6 class="mb-0">{{ emp.name }}</h6>
  <a href="/employees/{{ emp.id }}" class="btn btn-sm btn-outline-primary">الملف</a>
</div>
<table class="table table-sm table-borderless">
  <tr><td class="text-muted small">الوظيفة</td><td>{{ emp.job or '—' }}</td></tr>
  <tr><td class="text-muted small">المنطقة</td><td>{{ emp.region or '—' }}</td></tr>
  <tr><td class="text-muted small">الراتب الشهري</td><td>{{ emp.salary or '—' }}</td></tr>
  <tr><td class="text-muted small">الهاتف</td><td>{{ emp.phone or '—' }}</td></tr>
  <tr><td class="text-muted small">الجنسية</td><td>{{ emp.nation or '—' }}</td></tr>
  <tr><td class="text-muted small">الكفالة</td><td>{{ emp.kafala or '—' }}</td></tr>
  <tr><td class="text-muted small">الحالة</td><td>{{ emp.status or '—' }}</td></tr>
  <tr><td class="text-muted small">الفئة</td><td>{{ emp.category or '—' }}</td></tr>
</table>
