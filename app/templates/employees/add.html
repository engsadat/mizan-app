<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8"><title>ميزان — إضافة موظف</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <style>body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body>
<nav class="navbar mb-3" style="background:#0a1f3d">
  <a href="/employees/" class="navbar-brand text-white px-3">← الموظفون</a>
</nav>
<div class="container py-3" style="max-width:760px">
  <h5 class="mb-4">إضافة موظف جديد</h5>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}<div class="alert alert-{{ cat }}">{{ msg }}</div>{% endfor %}
  {% endwith %}
  <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="row g-3">
      <div class="col-12">
        <label class="form-label">الاسم الكامل *</label>
        <input type="text" name="full_name" class="form-control" required>
      </div>
      <div class="col-md-6">
        <label class="form-label">المنطقة</label>
        <select id="region-select" name="region" class="form-select">
          <option value="">— اختر —</option>
          {% for r in regions %}<option value="{{ r }}">{{ r }}</option>{% endfor %}
        </select>
        <input type="hidden" id="cbu-input" name="cbu">
      </div>
      <div class="col-md-6">
        <label class="form-label">الوظيفة</label>
        <select id="job-select" name="job_code_id" class="form-select">
          <option value="">— اختر —</option>
          {% for jc in job_codes %}<option value="{{ jc.id }}">{{ jc.title }}</option>{% endfor %}
        </select>
        <input type="hidden" id="price-input" name="unit_price">
      </div>
      <div class="col-md-6">
        <label class="form-label">الجنسية</label>
        <select name="nationality_id" class="form-select">
          <option value="">— اختر —</option>
          {% for n in nationalities %}<option value="{{ n.id }}">{{ n.name_ar }}</option>{% endfor %}
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label">الكفالة</label>
        <select name="kafala" class="form-select">
          <option value="">— اختر —</option>
          <option>على الكفالة</option>
          <option>أجير</option>
          <option>سعودي</option>
          <option>أجير- جاري</option>
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label">الهاتف</label>
        <input type="text" name="phone" class="form-control">
      </div>
      <div class="col-md-6">
        <label class="form-label">نوع الإشراف</label>
        <select name="supervision_type" class="form-select">
          <option value="">— اختر —</option>
          <option>إشراف</option>
          <option>دعم فني</option>
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label">المكتب</label>
        <select name="office_id" class="form-select">
          <option value="">— اختر —</option>
          {% for o in offices %}<option value="{{ o.id }}">{{ o.name }}</option>{% endfor %}
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label">كشف الحضور</label>
        <select name="attendance_group_id" class="form-select">
          <option value="">— اختر —</option>
          {% for g in att_groups %}<option value="{{ g.id }}">{{ g.name }}</option>{% endfor %}
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label">تاريخ الالتحاق</label>
        <input type="date" name="hire_date" class="form-control">
      </div>
      <div class="col-md-6">
        <label class="form-label">نهاية العقد</label>
        <input type="date" name="contract_end_date" class="form-control">
      </div>
      <div class="col-md-6">
        <label class="form-label">الحالة *</label>
        <select name="current_status_id" class="form-select" required>
          <option value="">— اختر —</option>
          {% for st in statuses %}<option value="{{ st.id }}">{{ st.name_ar }}</option>{% endfor %}
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label">المدير المباشر</label>
        <input type="text" name="direct_manager" class="form-control">
      </div>
      <div class="col-12 mt-3">
        <button type="submit" class="btn" style="background:#0a1f3d;color:#fff">حفظ الموظف</button>
        <a href="/employees/" class="btn btn-secondary ms-2">إلغاء</a>
      </div>
    </div>
  </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const CBU_MAP = {'عسير':'AS','جازان':'JZ','الباحة':'BA','نجران':'NJ'};
const RATE_MAP = { {% for jc in job_codes %}{{ jc.id }}: {{ jc.standard_rate or 0 }}{% if not loop.last %},{% endif %}{% endfor %} };

document.getElementById('region-select').addEventListener('change', function() {
  document.getElementById('cbu-input').value = CBU_MAP[this.value] || '';
});
document.getElementById('job-select').addEventListener('change', function() {
  const rate = RATE_MAP[this.value];
  document.getElementById('price-input').value = rate || '';
});
</script>
</body>
</html>
