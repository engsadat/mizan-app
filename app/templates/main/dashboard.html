<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <title>ميزان — لوحة التحكم</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <style>body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body>
  <nav class="navbar" style="background:#0a1f3d">
    <span class="navbar-brand text-white px-3">ميزان</span>
    <a href="/auth/logout" class="btn btn-sm btn-outline-light ms-auto me-3">خروج</a>
  </nav>
  <div class="container-fluid p-4">
    <h5 class="mb-4">لوحة التحكم</h5>
    <div class="row g-3 mb-4">
      <div class="col-md-3"><div class="card p-3 text-center"><h2 style="color:#059669">{{ active_count }}</h2><small>إجمالي الموظفين على قوة العمل</small></div></div>
      <div class="col-md-3"><div class="card p-3 text-center"><h2 style="color:#0071b9;font-size:1.4rem">{{ monthly_total }}</h2><small>إجمالي الرواتب الشهرية (ر.س)</small></div></div>
    </div>
    <div class="row g-3">
      <div class="col-md-4">
        <a href="/employees/" class="card p-4 d-block text-decoration-none text-dark">
          <h5>👤 الموظفون</h5><small class="text-muted">إدارة بيانات الموظفين</small>
        </a>
      </div>
      {% if current_user.role == 'admin' %}
      <div class="col-md-4">
        <a href="/settings/" class="card p-4 d-block text-decoration-none text-dark">
          <h5>⚙️ الإعدادات</h5><small class="text-muted">الوظائف والمستخدمون</small>
        </a>
      </div>
      {% endif %}
      <div class="col-md-4">
        <a href="/reports/" class="card p-4 d-block text-decoration-none text-dark">
          <h5>📊 التقارير</h5><small class="text-muted">BI Charts وتقارير الفلترة والطباعة</small>
        </a>
      </div>
    </div>
  </div>
</body>
</html>
